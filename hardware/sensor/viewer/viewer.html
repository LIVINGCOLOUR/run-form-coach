<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMU Viewer</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 24px; background: #fafafa; color: #222; }
  button { font-size: 16px; padding: 8px 16px; margin-right: 8px; }
  #status { margin: 12px 0; font-weight: bold; }
  table { border-collapse: collapse; margin-top: 12px; }
  td, th { border: 1px solid #ccc; padding: 6px 14px; text-align: right; font-variant-numeric: tabular-nums; }
  th { background: #eee; }
  .note { color: #666; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<h1>IMU Viewer</h1>
<button id="connect">接続</button>
<button id="record" disabled>記録を始める</button>
<button id="save" disabled>CSVで保存</button>
<div id="status">未接続</div>
<table>
  <tr><th></th><th>x</th><th>y</th><th>z</th></tr>
  <tr><th>加速度 [g]</th><td id="ax">-</td><td id="ay">-</td><td id="az">-</td></tr>
  <tr><th>ジャイロ [dps]</th><td id="gx">-</td><td id="gy">-</td><td id="gz">-</td></tr>
</table>
<div id="rate" class="note">受信：- 回/秒</div>
<div class="note">
  置いたまま動かさないと、加速度のどれか1つが約 1.00（重力）、ジャイロはほぼ 0 になります。<br>
  受信が 1秒に約50回なら正常です。
</div>
<script>
const SERVICE = 0xffe0;
const CHAR = 0xffe1;
const G_SCALE = 0.07;     // dps / 1
const A_SCALE = 0.000244; // g / 1

const $ = (id) => document.getElementById(id);
let rows = [];
let recording = false;
let count = 0;

$('connect').onclick = async () => {
  if (!navigator.bluetooth) {
    $('status').textContent = 'このブラウザは Web Bluetooth に対応していません（Mac の Chrome で開いてください）';
    return;
  }
  try {
    $('status').textContent = '探しています…';
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'RFC-IMU' }],
      optionalServices: [SERVICE],
    });
    device.addEventListener('gattserverdisconnected', () => {
      $('status').textContent = '切断されました（もう一度「接続」を押してください）';
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    const ch = await service.getCharacteristic(CHAR);
    ch.addEventListener('characteristicvaluechanged', onData);
    await ch.startNotifications();
    $('status').textContent = '接続しました：' + device.name;
    $('record').disabled = false;
  } catch (e) {
    $('status').textContent = 'エラー：' + e.message;
  }
};

function onData(event) {
  const v = event.target.value;
  const t = v.getUint32(0, true);
  const g = [0, 1, 2].map((i) => v.getInt16(4 + i * 2, true) * G_SCALE);
  const a = [0, 1, 2].map((i) => v.getInt16(10 + i * 2, true) * A_SCALE);
  ['ax', 'ay', 'az'].forEach((id, i) => ($(id).textContent = a[i].toFixed(2)));
  ['gx', 'gy', 'gz'].forEach((id, i) => ($(id).textContent = g[i].toFixed(1)));
  count++;
  if (recording) rows.push([t, ...a.map((x) => x.toFixed(4)), ...g.map((x) => x.toFixed(2))]);
}

setInterval(() => {
  $('rate').textContent = '受信：' + count + ' 回/秒' + (recording ? '（記録中：' + rows.length + ' 件）' : '');
  count = 0;
}, 1000);

$('record').onclick = () => {
  recording = !recording;
  if (recording) rows = [];
  $('record').textContent = recording ? '記録を止める' : '記録を始める';
  $('save').disabled = recording || rows.length === 0;
};

$('save').onclick = () => {
  const header = 'time_ms,ax_g,ay_g,az_g,gx_dps,gy_dps,gz_dps\n';
  const body = rows.map((r) => r.join(',')).join('\n');
  const blob = new Blob([header + body], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'imu-' + new Date().toISOString().replace(/[:.]/g, '-') + '.csv';
  a.click();
};
</script>
</body>
</html>
